name: build

# 仓库之前没有任何自动校验：v2.0.1 起有 32 个源文件被 .gitignore 误伤、
# 从未进过仓库，而 clone 的人一构建就缺文件 —— 20 天没人发现。
# 这个 workflow 存在的唯一理由就是让这种情况下次当场变红。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (windows)
    # WPF 项目是 net10.0-windows，必须跑在 Windows 上；Linux runner 无法构建。
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json 钉的是 10.0.100 + rollForward=latestFeature
          dotnet-version: '10.0.x'

      - name: Show SDK info
        run: dotnet --info

      - name: Restore
        # ★ 必须带 -p:Configuration=Release：FatFish.App.csproj 里
        #   <RuntimeIdentifier Condition="'$(Configuration)'=='Release'">win-x64</RuntimeIdentifier>
        #   只在 Release 下生效。按默认（Debug）还原出来的 project.assets.json
        #   没有 net10.0-windows/win-x64 这个 target，随后的 Release 构建会报
        #   NETSDK1047。第一次接 CI 就是这么红的。
        run: dotnet restore FatFish.slnx -p:Configuration=Release

      - name: Build
        # 不开 TreatWarningsAsErrors：现有 50+ 条 CA1xxx 是既有的静态分析建议，
        # 一次性清零会把这次上线的 diff 淹没。先保证「能编译」这条底线。
        run: dotnet build FatFish.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FatFish.slnx -c Release --no-build --logger "trx;LogFileName=test.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
